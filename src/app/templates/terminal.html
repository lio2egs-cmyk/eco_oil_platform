<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>אקו דיפו — מסופון שטח</title>
<link rel="manifest" href="/static/field/manifest-{{ flow }}.json">
<link rel="icon" type="image/png" href="/static/field/icon-{{ flow }}-192.png">
<style>
  :root { --brand:#5B9E96; --dark:#2f5d57; --bg:#f4f7f6; }
  * { box-sizing:border-box; font-family:"Segoe UI",Arial,sans-serif; }
  body { margin:0; background:var(--bg); color:#222; }
  header { background:var(--brand); color:#fff; padding:14px 16px; font-size:20px; font-weight:bold;
           display:flex; justify-content:space-between; align-items:center; }
  header small { font-size:13px; font-weight:normal; }
  main { padding:16px; max-width:520px; margin:0 auto; }
  .btn { display:block; width:100%; border:none; border-radius:14px; padding:26px 10px; margin:14px 0;
         font-size:28px; font-weight:bold; color:#fff; background:var(--brand); }
  .btn:active { background:var(--dark); }
  .btn.secondary { background:#888; font-size:18px; padding:14px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  label { font-size:17px; font-weight:bold; display:block; margin:10px 0 4px; }
  select,input[type=text] { width:100%; font-size:20px; padding:10px; border:1px solid #bbb; border-radius:10px; }
  .treat { display:flex; flex-wrap:wrap; gap:8px; }
  .treat label { flex:1 1 44%; font-weight:normal; background:#eef4f3; border-radius:10px; padding:12px;
                 display:flex; gap:8px; align-items:center; font-size:18px; margin:0; }
  .treat input { width:24px; height:24px; }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .photos img { width:84px; height:84px; object-fit:cover; border-radius:10px; border:2px solid #ccc; }
  #queue .item { display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #eee; font-size:16px; }
  .ok { color:#1d8a3a; font-weight:bold; } .wait { color:#b8860b; } .err { color:#b03030; font-weight:bold; }
  .hidden { display:none; }
  #camBtn { background:var(--dark); font-size:22px; padding:18px; }
  .note { font-size:14px; color:#666; }
</style>
</head>
<body>
<header><span>אקו דיפו — שטח</span><small id="who"></small></header>
<main>

<!-- הגדרה ראשונית: הזנת מפתח מכשיר (פעם אחת, ע"י המשרד) -->
<div id="setup" class="card hidden">
  <label>מפתח מכשיר (מוזן פעם אחת ע"י המשרד)</label>
  <input type="text" id="tokenInput" autocomplete="off">
  <button class="btn" onclick="saveToken()">שמירה</button>
</div>

<!-- מסך הבית -->
<div id="home" class="hidden">
  <button class="btn" onclick="startFlow('entry')">📥 כניסה</button>
  <button class="btn" onclick="startFlow('wash')">🧼 שטיפה</button>
  <button class="btn" onclick="startFlow('exit')">📤 יציאה</button>
  <div class="card">
    <b>אירועים אחרונים</b>
    <div id="queue"></div>
  </div>
  <div class="card">
    <div class="note">יצירת אייקון נפרד למסך הבית: לוחצים על קישור ← ואז בתפריט הדפדפן "הוספה למסך הבית".</div>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <a href="/terminal/entry" style="flex:1; text-align:center; background:#eef4f3; border-radius:10px; padding:12px; font-size:18px; text-decoration:none; color:var(--dark); font-weight:bold;">📥 כניסה</a>
      <a href="/terminal/wash" style="flex:1; text-align:center; background:#eef4f3; border-radius:10px; padding:12px; font-size:18px; text-decoration:none; color:var(--dark); font-weight:bold;">🧼 שטיפה</a>
      <a href="/terminal/exit" style="flex:1; text-align:center; background:#eef4f3; border-radius:10px; padding:12px; font-size:18px; text-decoration:none; color:var(--dark); font-weight:bold;">📤 יציאה</a>
      <a href="/terminal/board" style="flex:1; text-align:center; background:#eef4f3; border-radius:10px; padding:12px; font-size:18px; text-decoration:none; color:var(--dark); font-weight:bold;">📋 דוח</a>
    </div>
  </div>
</div>

<!-- מסך אירוע -->
<div id="flow" class="hidden">
  <div class="card">
    <div id="flowTitle" style="font-size:24px;font-weight:bold;"></div>
    <label>סוג נכס</label>
    <select id="assetType" onchange="onAssetType()">
      <option value="iso">איזוטנק</option>
      <option value="rt">מכלית (רואדטנקר)</option>
    </select>
    <div id="pickWrap">
      <label>בחירת נכס — הקלידו כמה ספרות מהמספר</label>
      <input type="text" id="tankSearch" inputmode="numeric" autocomplete="off" placeholder="למשל: 4 ספרות אחרונות" oninput="filterTanks()">
      <div id="chosen" class="hidden" style="margin-top:8px; background:#dff0e2; border:2px solid #1d8a3a; border-radius:10px; padding:12px; font-size:20px; font-weight:bold;"></div>
      <div id="tankResults" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;"></div>
    </div>
    <div id="manualWrap">
      <label>מספר (אם ידוע — לא חובה, המשרד מפענח מהתמונה)</label>
      <input type="text" id="tankManual" autocapitalize="characters" autocomplete="off">
    </div>
    <button class="btn" id="camBtn" onclick="openCam()">📷 צילום</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" multiple>
    <div class="photos" id="thumbs"></div>
    <div id="treatWrap" class="hidden">
      <label>מה בוצע?</label>
      <div class="treat" id="treats"></div>
    </div>
    <div id="openWrap" class="hidden" style="margin-top:10px;">
      <label>פתחים שנשטפו</label>
      <div class="treat" id="openBoxes"></div>
    </div>
    <div id="vocWrap" class="hidden" style="margin-top:10px;">
      <label>בדיקת VOC — התוצאה מהמכשיר ב-ppm (רק אם בוצעה)</label>
      <input type="number" id="vocInput" inputmode="decimal" step="0.1" min="0" placeholder="למשל 0.0"
             style="width:100%; box-sizing:border-box; font-size:24px; padding:12px; border-radius:10px; border:2px solid #ccc; text-align:center;">
    </div>
    <div id="extraIso" class="hidden" style="margin-top:10px;">
      <label>פעולות נוספות</label>
      <div class="treat"><label style="background:#fff3cd;"><input type="checkbox" id="vacuumChk">בדיקת ואקום בוצעה</label></div>
    </div>
    <div id="extraRt" class="hidden" style="margin-top:10px;">
      <label>פעולות נוספות</label>
      <div class="treat"><label style="background:#fff3cd;"><input type="checkbox" id="pumpChk">משאבה</label></div>
    </div>
    <button class="btn" onclick="submitEvent()">✅ שליחה</button>
    <button class="btn secondary" onclick="goHome()">ביטול</button>
    <div class="note">אין קליטה? אפשר לשלוח — האירוע יחכה במכשיר ויעלה לבד.</div>
  </div>
</div>

<!-- מסך דוח תפעול חי (דאמוני 16/07 — במקום ה-PDF המודפס) -->
<div id="board" class="hidden">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
    <b id="boardStamp" style="font-size:17px;">דוח תפעול</b>
    <button class="btn secondary" style="width:auto; margin:0; padding:10px 16px;" onclick="loadBoard()">↻ רענון</button>
  </div>
  <div id="boardBody"><div class="note">טוען את הדוח...</div></div>
</div>

<!-- מצלמה פנימית: כל לחיצה = תמונה, בלי אישור בין צילומים -->
<div id="camPanel" style="display:none; position:fixed; inset:0; background:#000; z-index:50; flex-direction:column;">
  <video id="camVideo" autoplay playsinline muted style="flex:1; width:100%; object-fit:cover; min-height:0;"></video>
  <div style="display:flex; gap:10px; padding:14px; background:#111; align-items:center;">
    <button style="flex:1; font-size:26px; font-weight:bold; padding:18px; border:none; border-radius:14px; background:#c62828; color:#fff;" onclick="camShot()">📷 צילום</button>
    <span id="camCount" style="color:#fff; font-size:22px; min-width:90px; text-align:center;"></span>
    <button style="flex:1; font-size:26px; font-weight:bold; padding:18px; border:none; border-radius:14px; background:#1d8a3a; color:#fff;" onclick="closeCam()">✔ סיום</button>
  </div>
</div>

</main>
<script>
const TREATMENTS = ["מים קרים","מים חמים","חומר ניקוי בסיסי","אצטון","קיטור","ממיסים","יבוש",
                    "ויזואלי + ריח","ויזואלי","בדיקת pH","בדיקת אוויר"];
const API = "";
let flowType = null, photos = [];

// ---------- אחסון מקומי: תור אירועים (IndexedDB — שורד כיבוי וחוסר קליטה) ----------
let idb;
const idbReady = new Promise(res => {
  const rq = indexedDB.open("field_terminal", 1);
  rq.onupgradeneeded = e => e.target.result.createObjectStore("outbox", {keyPath:"client_uuid"});
  rq.onsuccess = e => { idb = e.target.result; res(); };
});
function outbox(mode) { return idb.transaction("outbox", mode).objectStore("outbox"); }
function idbAll() { return new Promise(res => { const r = outbox("readonly").getAll(); r.onsuccess = () => res(r.result); }); }
function idbPut(item) { return new Promise(res => { outbox("readwrite").put(item).onsuccess = res; }); }
function idbDel(key) { return new Promise(res => { outbox("readwrite").delete(key).onsuccess = res; }); }

const token = () => localStorage.getItem("device_token");
function saveToken() { localStorage.setItem("device_token", document.getElementById("tokenInput").value.trim()); location.reload(); }

function show(id) { for (const s of ["setup","home","flow","board"]) document.getElementById(s).classList.toggle("hidden", s !== id); }
function goHome() { closeCam(); show("home"); renderQueue(); }

// ---------- מסך אירוע ----------
function startFlow(t) {
  flowType = t; photos = [];
  document.getElementById("thumbs").innerHTML = "";
  document.getElementById("tankManual").value = "";
  document.getElementById("flowTitle").textContent = {entry:"📥 כניסה", wash:"🧼 שטיפה", exit:"📤 יציאה"}[t];
  document.getElementById("treatWrap").classList.toggle("hidden", t !== "wash");
  document.getElementById("pickWrap").classList.toggle("hidden", t === "entry");
  document.getElementById("manualWrap").classList.toggle("hidden", t !== "entry");
  if (t === "wash") {
    const tw = document.getElementById("treats");
    tw.innerHTML = TREATMENTS.map(x => `<label><input type="checkbox" value="${x}">${x}</label>`).join("");
    document.getElementById("vacuumChk").checked = false;
    document.getElementById("pumpChk").checked = false;
    document.getElementById("vocInput").value = "";
    document.getElementById("openBoxes").innerHTML =
      `<label style="background:#e3ecff; font-weight:bold;"><input type="checkbox" id="openAll" onchange="toggleAllOpenings(this.checked)">הכל (7)</label>` +
      [1,2,3,4,5,6,7].map(n => `<label><input type="checkbox" class="openChk" value="${n}" onchange="syncOpenAll()">פתח ${n}</label>`).join("");
  }
  document.getElementById("openWrap").classList.toggle("hidden", t !== "wash");
  document.getElementById("vocWrap").classList.toggle("hidden", t !== "wash");
  updateExtras();
  loadOnsite();   // גם בכניסה — הרשימה משמשת לבדיקת השער מול הצפויים
  show("flow");
}
function toggleAllOpenings(v) {
  document.querySelectorAll(".openChk").forEach(c => c.checked = v);
}
function syncOpenAll() {
  const all = [...document.querySelectorAll(".openChk")];
  document.getElementById("openAll").checked = all.every(c => c.checked);
}
function updateExtras() {
  // בדיקת ואקום = איזוטנק (עמודה Y, 55 ש"ח); משאבה = מכלית (עמודה M — בינתיים בדיווח בלבד)
  const at = document.getElementById("assetType").value;
  document.getElementById("extraIso").classList.toggle("hidden", !(flowType === "wash" && at === "iso"));
  document.getElementById("extraRt").classList.toggle("hidden", !(flowType === "wash" && at === "rt"));
}
function onAssetType() { updateExtras(); if (flowType !== "entry") loadOnsite(); }

let onsiteAssets = [], selectedTank = null, unlistedMode = false;

function enableUnlisted() {
  // המכל לא ברשימה: מדווחים עם צילום הלוחית; המשרד יקבל התראה להשלים כניסה,
  // והדיווח ימתין בענן ויוזן אוטומטית ברגע שהשורה תיפתח.
  unlistedMode = true; selectedTank = null;
  document.getElementById("tankSearch").value = "";
  document.getElementById("tankResults").innerHTML = "";
  document.getElementById("manualWrap").classList.remove("hidden");
  const c = document.getElementById("chosen");
  c.style.background = "#fff3cd"; c.style.borderColor = "#b8860b";
  c.textContent = "מכל לא ברשימה — חובה לצלם את לוחית המספר. אפשר גם להקליד את המספר אם קל לכם.";
  c.classList.remove("hidden");
}

function cancelUnlisted() {
  unlistedMode = false;
  document.getElementById("tankManual").value = "";
  if (flowType !== "entry") document.getElementById("manualWrap").classList.add("hidden");
}

async function loadOnsite() {
  cancelUnlisted();
  const at = document.getElementById("assetType").value;
  try {
    const r = await fetch(`${API}/field/api/onsite?asset_type=${at}`, {headers:{Authorization:"Bearer "+token()}});
    const d = await r.json();
    onsiteAssets = d.assets;
    localStorage.setItem("onsite_json_"+at, JSON.stringify(d.assets));
  } catch (e) { onsiteAssets = JSON.parse(localStorage.getItem("onsite_json_"+at) || "[]"); }
  selectedTank = null;
  document.getElementById("chosen").classList.add("hidden");
  document.getElementById("tankSearch").value = "";
  filterTanks();
}

function chooseTank(tank, cust) {
  cancelUnlisted();
  selectedTank = tank;
  const c = document.getElementById("chosen");
  c.style.background = "#dff0e2"; c.style.borderColor = "#1d8a3a";
  c.textContent = "✓ נבחר: " + tank + (cust ? " — " + cust : "");
  c.classList.remove("hidden");
  document.getElementById("tankResults").innerHTML = "";
  document.getElementById("tankSearch").value = "";
}

const UNLISTED_BTN = `<button type="button" style="font-size:20px; padding:14px; border-radius:10px; border:2px dashed #b8860b; background:#fff8e6; color:#222;" onclick="enableUnlisted()">🚫 המכל לא ברשימה — דיווח עם צילום המספר</button>`;

function filterTanks() {
  const q = (document.getElementById("tankSearch").value || "").replace(/[^0-9A-Za-z]/g, "").toUpperCase();
  const res = document.getElementById("tankResults");
  if (q) { selectedTank = null; cancelUnlisted(); document.getElementById("chosen").classList.add("hidden"); }
  if (!q) {
    if (unlistedMode) return;
    res.innerHTML = onsiteAssets.length
      ? `<div class="note">${onsiteAssets.length} נכסים במגרש — הקלידו ספרות כדי לצמצם</div>`
      : '<div class="note">הרשימה לא נטענה — בדקו קליטה ונסו שוב</div>' + UNLISTED_BTN;
    return;
  }
  const norm = t => (t || "").replace(/[^0-9A-Za-z]/g, "").toUpperCase();
  const matches = onsiteAssets.filter(a => {
    const t = norm(a.tank_number);
    return t.includes(q) || t.replace(/[^0-9]/g, "").includes(q);
  });
  const ends = a => norm(a.tank_number).replace(/[^0-9]/g, "").endsWith(q) ? 1 : 0;
  const top = matches.sort((a, b) => ends(b) - ends(a)).slice(0, 10);
  res.innerHTML = top.map(a =>
    `<button type="button" style="font-size:22px; padding:14px; border-radius:10px; border:2px solid var(--brand); background:#fff; color:#222; text-align:right;"
      onclick='chooseTank(${JSON.stringify(a.tank_number)}, ${JSON.stringify(a.customer || "")})'>${a.tank_number}${a.customer ? " — " + a.customer : ""}</button>`
  ).join("") || '<div class="note">אין התאמה — בדקו את הספרות</div>' + UNLISTED_BTN;
  if (matches.length > 10) res.innerHTML += `<div class="note">מוצגות 10 מתוך ${matches.length} התאמות — הוסיפו עוד ספרה</div>`;
}

function addThumb(f) {
  // תמונה ממוזערת + כפתור מחיקה ✕ (למחוק תמונה לא טובה לפני השליחה)
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:relative; display:inline-block;";
  const img = document.createElement("img");
  img.src = URL.createObjectURL(f);
  const x = document.createElement("button");
  x.textContent = "✕";
  x.style.cssText = "position:absolute; top:-8px; right:-8px; background:#b03030; color:#fff; border:2px solid #fff; border-radius:50%; width:32px; height:32px; font-size:16px; font-weight:bold;";
  x.onclick = () => { photos = photos.filter(p => p !== f); wrap.remove(); };
  wrap.appendChild(img); wrap.appendChild(x);
  document.getElementById("thumbs").appendChild(wrap);
}

document.getElementById("fileInput").addEventListener("change", ev => {
  for (const f of ev.target.files) { photos.push(f); addThumb(f); }
  ev.target.value = "";
});
const fileInput = document.getElementById("fileInput");

// ---------- דוח תפעול חי (דאמוני 16/07) ----------
function esc(t) { return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function warnSpan(t) {
  const e = esc(t);
  return t && String(t).startsWith("⚠") ? `<span style="color:#b03030; font-weight:bold;">${e}</span>` : e;
}

function boardCard(r, extra) {
  return `<div style="border-bottom:1px solid #e5e5e5; padding:10px 2px;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <span style="font-size:19px; font-weight:bold;">${esc(r.tank)}</span>
      <span style="font-size:16px; color:#444;">${esc(r.customer)}</span>${extra || ""}
    </div>
    <div style="font-size:15px; color:#333; margin-top:3px;">${r.line}</div>
  </div>`;
}

function boardSection(title, rows, mk) {
  return `<div class="card"><b style="font-size:19px;">${title} (${rows.length})</b>` +
    (rows.length ? rows.map(mk).join("") : '<div class="note">אין רשומות</div>') + `</div>`;
}

const READY_SENT_KEY = "board_ready_sent";   // מוכן שנשלח וטרם התעדכן בדוח — לא להציע שוב
function readySent() { try { return JSON.parse(localStorage.getItem(READY_SENT_KEY) || "{}"); } catch (e) { return {}; } }

async function sendReady(tank, btn) {
  if (!confirm("לסמן את " + tank + " כמוכן לשחרור?")) return;
  const item = {client_uuid: crypto.randomUUID(), event_type: "ready", asset_type: "iso",
                tank_number: tank, event_at: localIso(), payload: {},
                photos: [], label: "מוכן ✓ " + tank, state: "queued", ts: Date.now()};
  await idbPut(item);
  const sent = readySent(); sent[tank] = Date.now();
  localStorage.setItem(READY_SENT_KEY, JSON.stringify(sent));
  btn.textContent = "⌛ נשלח"; btn.disabled = true; btn.style.background = "#eee";
  pump();
}

function renderBoard(d, offline) {
  const el = document.getElementById("boardBody");
  if (!d || !d.board) {
    el.innerHTML = '<div class="card"><div class="note">אין עדיין דוח בענן — הוא יופיע ברגע שהשליח במשרד ידחוף אותו.</div></div>';
    return;
  }
  const b = d.board, sent = readySent();
  document.getElementById("boardStamp").textContent =
    "📋 נכון ל-" + (b.generated || "") + (offline ? "  ⚠ ללא קליטה — מוצג מהזיכרון" : "");
  const relLine = r => [r.pickup ? "איסוף: " + r.pickup : "", r.service, warnSpan(r.wash),
                        r.dest ? "יעד: " + esc(r.dest) : "", esc(r.carrier)].filter(Boolean).join(" | ");
  el.innerHTML =
    boardSection("להכנה", b.release_prep || [], r => boardCard(
      {tank: r.tank, customer: r.customer, line: relLine(r)},
      sent[r.tank]
        ? `<button disabled style="font-size:16px; padding:8px 12px; border-radius:10px; border:none; background:#eee;">⌛ נשלח</button>`
        : `<button style="font-size:16px; font-weight:bold; padding:8px 12px; border-radius:10px; border:none; background:#1d8a3a; color:#fff;"
             onclick='sendReady(${JSON.stringify(r.tank)}, this)'>מוכן ✓</button>`)) +
    boardSection("ממתינים לאיסוף", b.release_wait || [], r => boardCard(
      {tank: r.tank, customer: r.customer, line: relLine(r)})) +
    boardSection("טנקים לטיפול", b.care || [], r => boardCard(
      {tank: r.tank, customer: r.customer,
       line: [esc(r.material), "כניסה: " + warnSpan(r.arrival || "⚠ חסר"), esc(r.status), esc(r.treatment)].filter(Boolean).join(" | ")})) +
    boardSection("צפויים להיכנס", b.expected || [], r => boardCard(
      {tank: r.tank, customer: r.customer,
       line: [esc(r.material), esc(r.service), esc(r.notes), r.hazard ? "מסוכן" : ""].filter(Boolean).join(" | ")}));
}

async function loadBoard() {
  try {
    const r = await fetch(`${API}/field/api/board`, {headers: {Authorization: "Bearer " + token()}});
    const d = await r.json();
    if (d.board) {
      // ניקוי סימוני "נשלח" שכבר נקלטו (הנכס עבר לממתינים לאיסוף)
      const prep = new Set((d.board.release_prep || []).map(x => x.tank));
      const sent = readySent();
      for (const t of Object.keys(sent)) if (!prep.has(t)) delete sent[t];
      localStorage.setItem(READY_SENT_KEY, JSON.stringify(sent));
      localStorage.setItem("board_json", JSON.stringify(d));
    }
    renderBoard(d.board ? d : null);
  } catch (e) {
    const cached = localStorage.getItem("board_json");
    renderBoard(cached ? JSON.parse(cached) : null, true);
  }
}

// ---------- מצלמה פנימית: צילום רציף בלי אישור בין תמונות ----------
let camStream = null;
async function openCam() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia(
      {video: {facingMode: "environment", width: {ideal: 1920}, height: {ideal: 1080}}, audio: false});
    document.getElementById("camVideo").srcObject = camStream;
    document.getElementById("camPanel").style.display = "flex";
    updateCamCount();
  } catch (e) { fileInput.click(); }  // אין הרשאת מצלמה — נפילה למצלמת המערכת
}
function updateCamCount() {
  document.getElementById("camCount").textContent = photos.length ? photos.length + " תמונות" : "";
}
function camShot() {
  const v = document.getElementById("camVideo");
  if (!v.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(b => {
    if (!b) return;
    const f = new File([b], "cam_" + Date.now() + ".jpg", {type: "image/jpeg"});
    photos.push(f); addThumb(f); updateCamCount();
    // הבזק משוב קצר — שהעובד יראה שהתמונה נתפסה
    v.style.opacity = "0.25";
    setTimeout(() => { v.style.opacity = "1"; }, 120);
  }, "image/jpeg", 0.85);
}
function closeCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  document.getElementById("camPanel").style.display = "none";
}

function localIso() {
  // תאריך-שעה בשעון המקומי של המכשיר (לא UTC) — עמודות L/M/AI בקובץ הן שעון ישראל
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

async function submitEvent() {
  const at = document.getElementById("assetType").value;
  let tank = (flowType === "entry" || unlistedMode) ? document.getElementById("tankManual").value
                                                    : selectedTank;
  if (flowType !== "entry" && !unlistedMode && !tank) { alert("נא לבחור נכס מהרשימה (הקלידו ספרות ולחצו על הנכס)"); return; }
  if ((flowType === "entry" || unlistedMode) && photos.length === 0) { alert("חובה לצלם את לוחית המספר"); return; }
  let notExpected = false;
  if (flowType === "entry" && tank && onsiteAssets.length) {
    // נוהל השער (דאמוני+יואב 16/07): מכל שאינו ברשימת הצפויים/הנמצאים — להניח בצד
    const nrm = x => (x || "").replace(/[^0-9A-Za-z]/g, "").toUpperCase();
    if (!onsiteAssets.some(a => nrm(a.tank_number) === nrm(tank))) {
      notExpected = true;
      if (!confirm("⚠ המכל " + tank.trim().toUpperCase() + " לא מופיע ברשימת הצפויים להיכנס.\n\n" +
                   "לפי הנוהל: להניח את המכל בצד ולא להכניס לאחסנה עד בירור מול המשרד.\n\n" +
                   "לשלוח את הדיווח למשרד לבירור?")) return;
    }
  }
  const treatments = flowType === "wash"
    ? [...document.querySelectorAll("#treats input:checked")].map(c => c.value) : [];
  const item = {
    client_uuid: crypto.randomUUID(),
    event_type: flowType, asset_type: at,
    tank_number: (tank || "").trim().toUpperCase(),
    event_at: localIso(),   // שעון מקומי! toISOString = UTC וגרם להזחת 3 שעות (לקח פיילוט 16/07)
    payload: {treatments, not_listed: unlistedMode, not_expected: notExpected,
              vacuum_test: flowType === "wash" && at === "iso" && document.getElementById("vacuumChk").checked,
              pump: flowType === "wash" && at === "rt" && document.getElementById("pumpChk").checked,
              voc_ppm: flowType === "wash" ? (document.getElementById("vocInput").value.trim() || null) : null,
              openings_count: flowType === "wash" ? document.querySelectorAll(".openChk:checked").length : 0},
    photos: await Promise.all(photos.map(async f => ({name:f.name, type:f.type, blob:f}))),
    label: `${document.getElementById("flowTitle").textContent} ${tank || "(מהתמונה)"}`,
    state: "queued", ts: Date.now(),
  };
  await idbPut(item);
  goHome();
  pump();
}

// ---------- משאבת שליחה: מנסה כל הזמן, שורדת חוסר קליטה ----------
let pumping = false;
async function pump() {
  if (pumping || !navigator.onLine) return;
  pumping = true;
  try {
    for (const item of await idbAll()) {
      if (item.state === "done") continue;
      const fd = new FormData();
      fd.append("event", JSON.stringify({client_uuid:item.client_uuid, event_type:item.event_type,
        asset_type:item.asset_type, tank_number:item.tank_number, event_at:item.event_at, payload:item.payload}));
      item.photos.forEach((p,i) => fd.append(i===0?"plate":"p"+i, p.blob, p.name||("p"+i+".jpg")));
      try {
        const r = await fetch(`${API}/field/api/events`, {method:"POST", body:fd,
                              headers:{Authorization:"Bearer "+token()}});
        if (r.ok) { item.state = "sent"; await idbPut(item); }
      } catch(e) { /* אין קליטה — יישאר בתור */ }
    }
  } finally { pumping = false; renderQueue(); }
}

// ---------- וי ירוק: שאילתת סטטוס מהענן ----------
async function pollStatus() {
  const items = (await idbAll()).filter(i => i.state === "sent");
  if (!items.length) return;
  try {
    const uuids = items.map(i => i.client_uuid).join(",");
    const r = await fetch(`${API}/field/api/events/status?uuids=${uuids}`, {headers:{Authorization:"Bearer "+token()}});
    const d = await r.json();
    for (const it of items) {
      const st = d.events[it.client_uuid];
      if (st && (st.status === "posted" || st.status === "error")) {
        it.state = "done"; it.result = st.status; it.note = st.note || "";
        it.photos = [];   // שחרור מקום — התמונות כבר במשרד
        await idbPut(it);
      }
    }
  } catch(e) {}
  renderQueue();
}

async function renderQueue() {
  const q = document.getElementById("queue");
  const items = (await idbAll()).sort((a,b) => b.ts - a.ts).slice(0, 12);
  q.innerHTML = items.map(i => {
    const mark = i.state === "queued" ? '<span class="wait">⌛ ממתין לקליטה</span>'
              : i.state === "sent" ? '<span class="wait">☁ הגיע לענן</span>'
              : i.result === "posted" ? '<span class="ok">✓ נקלט במשרד</span>'
              : '<span class="err">⚠ ' + (i.note||"שגיאה") + '</span>';
    return `<div class="item"><span>${i.label}</span>${mark}</div>`;
  }).join("") || '<div class="note">אין אירועים עדיין</div>';
}

// ---------- אתחול ----------
// כתובת ייעודית לכל פעולה (/terminal/entry|wash|exit) — לאייקונים נפרדים במסך הבית:
// לחיצה על אייקון פותחת ישר את מסך הפעולה; הכותרת קובעת את שם האייקון בעת ההוספה.
const FLOW_PARAM = "{{ flow }}" === "main" ? null : "{{ flow }}";
const FLOW_TITLES = {entry:"כניסה — אקו דיפו", wash:"שטיפה — אקו דיפו", exit:"יציאה — אקו דיפו",
                     board:"דוח תפעול — אקו דיפו"};
if (FLOW_TITLES[FLOW_PARAM]) document.title = FLOW_TITLES[FLOW_PARAM];
// service worker — נדרש להתקנת אפליקציה מלאה (אייקון אמיתי בלי תג דפדפן)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", {scope: "/terminal"}).catch(() => {});
idbReady.then(async () => {
  if (!token()) { show("setup"); return; }
  document.getElementById("who").textContent = "";
  show("home"); renderQueue();
  if (FLOW_PARAM === "board") {
    show("board"); loadBoard();
    setInterval(loadBoard, 60000);   // מתעדכן לבד כל דקה
  } else if (FLOW_TITLES[FLOW_PARAM]) {
    startFlow(FLOW_PARAM);
  }
  pump(); pollStatus();
  setInterval(pump, 15000);
  setInterval(pollStatus, 20000);
  window.addEventListener("online", pump);
});
</script>
