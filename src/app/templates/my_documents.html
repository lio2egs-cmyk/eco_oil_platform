<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המסמכים שלי — {{ brand }}</title>
<style>
  :root { --green:#5B9E96; --dark:#2E5E58; --bg:#F5F8F7; --line:#D8E4E2; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:Arial,"Segoe UI",sans-serif; background:var(--bg); color:#233; }
  header { background:#fff; border-bottom:3px solid var(--green); padding:14px 22px;
           display:flex; align-items:center; gap:14px; }
  header img { height:44px; }
  header .t { font-size:20px; font-weight:bold; color:var(--dark); }
  header .who { margin-inline-start:auto; color:#567; font-size:14px; }
  .wrap { max-width:1080px; margin:22px auto; padding:0 16px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  select,input[type=text] { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
           font-family:inherit; font-size:14px; background:#fff; }
  input[type=text] { min-width:220px; }
  .count { color:#567; font-size:13px; margin-inline-start:auto; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px;
          overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.07); }
  th { background:var(--green); color:#fff; padding:10px 12px; font-size:14px; text-align:right; }
  td { padding:9px 12px; border-bottom:1px solid var(--line); font-size:14px; }
  tr:hover td { background:#F0F6F5; }
  .btn { display:inline-block; background:var(--green); color:#fff; border:none; cursor:pointer;
         padding:6px 14px; border-radius:8px; font-size:13px; font-family:inherit; }
  .btn:hover { background:var(--dark); }
  .btn-manifest { background:#8A6FB8; }
  .btn-manifest:hover { background:#6B549A; }
  /* כפתור ההורדה — נפרד ומודע (לימור 18/08) */
  .btn-dl { background:#fff; color:var(--dark); border:1.5px solid var(--green);
            padding:5px 10px; margin-inline-start:4px; font-weight:bold; }
  .btn-dl:hover { background:var(--green); color:#fff; }
  .nofile { color:#99A; font-size:12px; background:#EEF1F1; padding:4px 10px; border-radius:8px; }
  .sanction { display:block; max-width:280px; background:#FDF1DD; border:1.5px solid #E5B96B;
              color:#8a5a00; font-size:12.5px; line-height:1.5; padding:7px 10px; border-radius:10px; }
  .sanction .btn-decl { display:inline-block; margin-top:6px; background:#C47D1A; color:#fff;
              padding:5px 12px; border-radius:8px; font-size:12.5px; text-decoration:none; font-weight:600; }
  .sanction .btn-decl:hover { background:#a96812; }
  .doconly { color:#667; font-size:12px; background:#E9EDEC; padding:4px 10px; border-radius:8px; }
  /* חסימת מסמכים ברמת החברה (לימור 17/08) — הודעה מנומסת, בלי נימה של עונש */
  .blocked-banner { display:none; background:#EEF3F7; border:1.5px solid #B9CBDA; color:#2F4A60;
              font-size:14px; line-height:1.6; padding:12px 16px; border-radius:10px; margin-bottom:12px; }
  .blocked-cell { color:#4A6478; font-size:12px; background:#EEF3F7; border:1px solid #C9D8E4;
              padding:4px 10px; border-radius:8px; display:inline-block; }
  .back { color:var(--dark); text-decoration:none; font-size:14px; }
  .empty { text-align:center; padding:40px; color:#678; background:#fff; border-radius:10px; }
  .tabs { display:none; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tab { background:#fff; border:1.5px solid var(--line); color:var(--dark); cursor:pointer;
         padding:8px 18px; border-radius:10px; font-size:14px; font-family:inherit; }
  .tab.on { background:var(--green); border-color:var(--green); color:#fff; font-weight:bold; }
  @media (max-width:700px){ .hide-m { display:none; } }
</style>
</head>
<body>
<header>
  <img src="{{ url_for('static', filename=logo) }}" alt="{{ brand }}">
  <div class="t">המסמכים שלי</div>
  <div class="who" id="who"></div>
  <a class="back" href="/portal">→ חזרה לעמוד הראשי</a>
</header>
<div class="wrap">
  <!-- multi-company users (Limor 02/08): switch between their companies -->
  <div class="tabs" id="companyTabs"></div>
  <div class="blocked-banner" id="blockedBanner"></div>
  <div class="filters">
    <select id="fYear"><option value="">כל השנים</option></select>
    <select id="fStream"><option value="">כל הזרמים</option></select>
    <input type="text" id="fQ" placeholder="חיפוש לפי שם או מוביל…">
    <span class="count" id="count"></span>
  </div>
  <div id="content"><div class="empty">טוען…</div></div>
</div>
<script>
if(!localStorage.getItem('eco_access_token')){ location.href='/login'; }
/* משתמש "הצהרות בלבד" (לקוח עקיף, לימור 05/08) — אין לו אזור מסמכים; ה-API חוסם ממילא */
try{ if(JSON.parse(localStorage.getItem('eco_user')||'{}').role==='eco_oil_declaration_only'){ location.href='/portal'; } }catch(e){}
var MODE='billed';
var BLOCKED=false;   /* חסימת מסמכים ברמת החברה (17/08) */

async function apiGet(url){
  var r=await fetch(url,{headers:{'Authorization':'Bearer '+localStorage.getItem('eco_access_token')}});
  if(r.status===401){
    var rt=localStorage.getItem('eco_refresh_token');
    if(rt){
      var rr=await fetch('/auth/refresh',{method:'POST',headers:{'Authorization':'Bearer '+rt}});
      if(rr.ok){
        var rd=await rr.json();
        localStorage.setItem('eco_access_token', rd.access_token||'');
        r=await fetch(url,{headers:{'Authorization':'Bearer '+localStorage.getItem('eco_access_token')}});
      } else { location.href='/login'; return null; }
    } else { location.href='/login'; return null; }
  }
  return r;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// CID = which company's documents to show. Starts from the URL (admin preview);
// multi-company users change it via the company tabs (server validates ownership).
var CID=new URLSearchParams(location.search).get('client_id');

function renderTabs(companies, currentId){
  var el=document.getElementById('companyTabs');
  if(!companies||companies.length<2){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML=companies.map(function(c){
    return '<button class="tab'+(c.id===currentId?' on':'')+'" onclick="switchCompany('+c.id+')">'+esc(c.name)+'</button>';
  }).join('');
}

function switchCompany(id){
  CID=String(id);
  // facets (years/streams) belong to the company — rebuild them on switch
  document.getElementById('fYear').innerHTML='<option value="">כל השנים</option>';
  document.getElementById('fStream').innerHTML='<option value="">כל הזרמים</option>';
  document.getElementById('fQ').value='';
  load(true);
}

async function load(first){
  var p=new URLSearchParams();
  var y=document.getElementById('fYear').value, s=document.getElementById('fStream').value,
      q=document.getElementById('fQ').value.trim();
  if(y)p.set('year',y); if(s)p.set('stream',s); if(q)p.set('q',q);
  if(CID)p.set('client_id',CID);
  var r=await apiGet('/eco-oil/my-documents?'+p.toString());
  if(!r||!r.ok){ document.getElementById('content').innerHTML='<div class="empty">שגיאה בטעינה</div>'; return; }
  var d=await r.json();
  MODE=d.mode;
  BLOCKED=!!d.docs_blocked;
  document.getElementById('who').textContent=d.client_name;
  renderTabs(d.companies, d.client_id);
  var bb=document.getElementById('blockedBanner');
  bb.textContent=d.docs_blocked_notice||'';
  bb.style.display=BLOCKED?'block':'none';
  if(first){
    d.years.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v;
      document.getElementById('fYear').appendChild(o); });
    d.streams.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v;
      document.getElementById('fStream').appendChild(o); });
  }
  document.getElementById('count').textContent=d.rows.length+' פריקות';
  if(!d.rows.length){ document.getElementById('content').innerHTML='<div class="empty">לא נמצאו פריקות</div>'; return; }
  var srcCol = MODE==='billed';
  var h='<table><tr><th>תאריך</th>'+(srcCol?'<th>מקור הפסולת</th>':'')+
        '<th>זרם</th><th>כמות (טון)</th><th class="hide-m">מוביל</th><th>מסמכים — צפייה או ⬇ הורדה</th></tr>';
  d.rows.forEach(function(r){
    h+='<tr><td>'+esc(r.date)+'</td>'+
       (srcCol?'<td>'+esc(r.customer)+'</td>':'')+
       '<td>'+esc(r.stream||'')+'</td>'+
       '<td>'+(r.tons!=null?r.tons:'')+'</td>'+
       '<td class="hide-m">'+esc(r.transporter||'')+'</td>'+
       '<td>'+docCell(r)+'</td></tr>';
  });
  document.getElementById('content').innerHTML=h+'</table>';
}

function docCell(r){
  var out='';
  /* התווית אומרת גם מה הכפתור עושה (לימור 18/08): לקוח על הקו חיפש
     "כפתור הורדה" ולא הבין ששם המסמך הוא הכפתור. */
  /* צפייה והורדה הן שתי פעולות נפרדות (לימור 18/08): שם המסמך פותח
     לצפייה, וההורדה היא כפתור ⬇ נפרד ומודע. */
  if(r.has_pdf) out+='<button class="btn" title="פתיחת אישור הפריקה לצפייה" '+
    'onclick="viewDoc('+r.id+')">אישור פריקה</button>'+
    '<button class="btn btn-dl" title="הורדת אישור הפריקה למחשב" '+
    'onclick="dl('+r.id+')">⬇</button>';
  if(r.has_manifest) out+=' <button class="btn btn-manifest" title="פתיחת הטופס המלווה לצפייה" '+
    'onclick="viewDoc('+r.id+',\'manifest\')">טופס מלווה</button>'+
    '<button class="btn btn-dl" title="הורדת הטופס המלווה למחשב" '+
    'onclick="dlm('+r.id+')">⬇</button>';
  if(out) return out;
  // חסימת חברה (17/08) — אותה הודעה בכל שורה, כדי שגם מי שגלל למטה יבין למה
  if(BLOCKED) return '<span class="blocked-cell">לפנות להנהלת החשבונות</span>';
  if(r.doc_status==='awaiting_declaration')
    // First sentence approved by Yoav 20/07/2026; per-site sentence added per
    // Limor 13/08/2026 (the אידיאה multi-site case) — do not change without approval.
    return '<span class="sanction">הפריקה תועדה, אך הפסולת אינה מאושרת לקליטה ולטיפול — עקב אי-הסדרת הצהרת יצרן כנדרש בחוק.'+
           '<br>שימו לב: הצהרת יצרן נדרשת לכל אתר של העסק בנפרד, ולכל זרם המפונה ממנו.'+
           '<br><a class="btn-decl" href="/declaration">למילוי הצהרת יצרן</a></span>';
  if(r.doc_status==='no_cert_by_design')
    return '<span class="doconly">מתועד — ללא אישור פריקה</span>';
  if(r.doc_status==='unpublished')
    // Limor's "לא לפרסם" — docs withheld, deliberately with no explanation.
    return '<span class="nofile">—</span>';
  return '<span class="nofile">אין קובץ</span>';
}

/* צפייה: פותחים את החלון מיד בלחיצה — לפני הפנייה לשרת — אחרת חוסם
   החלונות בנייד עוצר אותו, כי אחרי await זו כבר לא לחיצת משתמש. */
async function viewDoc(id,doc){
  var w=window.open('','_blank');
  var qp=new URLSearchParams();
  qp.set('mode','view');
  if(doc)qp.set('doc',doc);
  if(CID)qp.set('client_id',CID);
  var r=await apiGet('/eco-oil/my-documents/'+id+'/download?'+qp.toString());
  if(!r||!r.ok){
    if(w) w.close();
    var msg='הקובץ אינו זמין כרגע';
    try{ var e=await r.json(); if(e&&e.message) msg=e.message; }catch(_){}
    alert(msg); return;
  }
  var d=await r.json();
  if(d.url && w) w.location=d.url;
  else if(d.url) location.href=d.url;
}

async function dl(id,doc){
  var qp=new URLSearchParams();
  if(doc)qp.set('doc',doc);
  if(CID)qp.set('client_id',CID);
  var url='/eco-oil/my-documents/'+id+'/download'+(qp.toString()?'?'+qp.toString():'');
  var r=await apiGet(url);
  if(!r||!r.ok){
    var msg='הקובץ אינו זמין כרגע';
    try{ var e=await r.json(); if(e&&e.message) msg=e.message; }catch(_){}
    alert(msg); return;
  }
  var d=await r.json();
  if(d.url) startDownload(d.url);
}
function dlm(id){ dl(id,'manifest'); }

/* הורדה במקום פתיחת חלון (לימור 18/08, מול לקוח בטלפון): window.open אחרי
   await כבר לא נחשב "לחיצת משתמש", ולכן נחסם בחוסם-החלוצים בנייד, ובחלק
   מהדפדפנים נפתח כצפייה בלי אפשרות שמירה נראית. האחסון כבר מחזיר את
   הקובץ כ-attachment, ולכן לחיצה על קישור רגיל מורידה אותו בלי לנווט
   ובלי לפתוח חלון. */
function startDownload(url){
  var a=document.createElement('a');
  a.href=url;
  a.rel='noopener';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); },0);
}

['fYear','fStream'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){load(false);});
});
var t=null;
document.getElementById('fQ').addEventListener('input',function(){
  clearTimeout(t); t=setTimeout(function(){load(false);},350);
});
load(true);
</script>
</body>
</html>
