<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אקו דיפו — ניהול מסופונים</title>
<style>
  :root { --brand:#5B9E96; --dark:#2f5d57; --bg:#f4f7f6; }
  * { box-sizing:border-box; font-family:"Segoe UI",Arial,sans-serif; }
  body { margin:0; background:var(--bg); color:#222; }
  header { background:var(--brand); color:#fff; padding:14px 16px; font-size:20px; font-weight:bold;
           display:flex; justify-content:space-between; align-items:center; }
  header small { font-size:13px; font-weight:normal; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  label { font-size:16px; font-weight:bold; display:block; margin:10px 0 4px; }
  input { width:100%; font-size:18px; padding:10px; border:1px solid #bbb; border-radius:10px; }
  .btn { display:inline-block; border:none; border-radius:12px; padding:12px 22px; margin:12px 0 0;
         font-size:18px; font-weight:bold; color:#fff; background:var(--brand); cursor:pointer; }
  .btn:active { background:var(--dark); }
  .btn.small { font-size:14px; padding:7px 14px; margin:0; background:#a05252; }
  .btn.copy { background:var(--dark); }
  .err { color:#b03030; font-weight:bold; margin-top:8px; }
  .ok { color:#1d8a3a; font-weight:bold; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th,td { border:1px solid #d7e0de; padding:8px; font-size:15px; text-align:right; }
  th { background:#eef4f3; }
  .muted { color:#888; }
  #tokenBox { direction:ltr; text-align:center; font-family:Consolas,monospace; font-size:17px;
              background:#eef4f3; border:2px dashed var(--brand); border-radius:10px;
              padding:14px; margin:10px 0; word-break:break-all; user-select:all; }
  .warn { background:#fff6e5; border-radius:10px; padding:10px; font-size:14px; margin-top:8px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><span>אקו דיפו — ניהול מסופונים</span><small id="who"></small></header>
<main>

<!-- התחברות מנהלת -->
<div id="loginCard" class="card">
  <b style="font-size:18px;">התחברות ניהול</b>
  <label>שם משתמש</label>
  <input type="text" id="u" autocomplete="username">
  <label>סיסמה</label>
  <input type="password" id="p" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" onclick="doLogin()">כניסה</button>
  <div id="loginErr" class="err hidden"></div>
</div>

<!-- יצירת מכשיר -->
<div id="createCard" class="card hidden">
  <b style="font-size:18px;">מסופון חדש</b>
  <label>שם המסופון (תפקיד — עובד, למשל: מגרש — דאמוני)</label>
  <input type="text" id="workerName" onkeydown="if(event.key==='Enter')createDevice()">
  <button class="btn" onclick="createDevice()">יצירת מסופון ומפתח</button>
  <div id="createErr" class="err hidden"></div>
  <div id="tokenWrap" class="hidden">
    <div class="ok" style="margin-top:12px;">✓ המסופון נוצר. זה המפתח שלו:</div>
    <div id="tokenBox"></div>
    <button class="btn copy" onclick="copyToken()">📋 העתקת המפתח</button>
    <span id="copied" class="ok hidden"> הועתק ✓</span>
    <div class="warn">המפתח מוצג פעם אחת בלבד. מדביקים אותו עכשיו בעמוד המסופון בטאבלט
      (https://depot.eco-oil.co.il/terminal). אם המפתח אבד — מכבים את המסופון ויוצרים חדש.</div>
  </div>
</div>

<!-- רשימת מכשירים -->
<div id="listCard" class="card hidden">
  <b style="font-size:18px;">מסופונים קיימים</b>
  <div id="listWrap"></div>
</div>

</main>
<script>
let TOK = sessionStorage.getItem("fieldAdminTok") || "";

function show(id, on) { document.getElementById(id).classList.toggle("hidden", !on); }
function seterr(id, msg) { const e = document.getElementById(id); e.textContent = msg || ""; e.classList.toggle("hidden", !msg); }

async function api(path, method, body) {
  const r = await fetch(path, {
    method: method || "GET",
    headers: Object.assign({"Content-Type": "application/json"},
                           TOK ? {"Authorization": "Bearer " + TOK} : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && path !== "/auth/login") { logout(); throw new Error("פג תוקף ההתחברות — יש להתחבר שוב"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("שגיאה " + r.status));
  return data;
}

async function doLogin() {
  seterr("loginErr", "");
  try {
    const d = await api("/auth/login", "POST",
      {username: document.getElementById("u").value.trim(), password: document.getElementById("p").value});
    if (!d.user || d.user.role !== "admin") { seterr("loginErr", "המשתמש הזה אינו משתמש ניהול"); return; }
    TOK = d.access_token;
    sessionStorage.setItem("fieldAdminTok", TOK);
    sessionStorage.setItem("fieldAdminName", d.user.username);
    document.getElementById("p").value = "";
    enter();
  } catch (e) { seterr("loginErr", e.message === "Invalid credentials" ? "שם משתמש או סיסמה שגויים" : e.message); }
}

function logout() {
  TOK = ""; sessionStorage.removeItem("fieldAdminTok");
  show("loginCard", true); show("createCard", false); show("listCard", false);
}

function enter() {
  show("loginCard", false); show("createCard", true); show("listCard", true);
  document.getElementById("who").textContent = sessionStorage.getItem("fieldAdminName") || "";
  refreshList();
}

function fmtSeen(iso) {
  if (!iso) return "עוד לא התחבר";
  const d = new Date(iso + "Z");
  return d.toLocaleString("he-IL", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}

async function refreshList() {
  try {
    const d = await api("/field/api/devices");
    const rows = d.devices.map(x =>
      "<tr><td>" + x.worker_name + "</td>" +
      "<td>" + (x.active ? "פעיל" : "<span class='muted'>כבוי</span>") + "</td>" +
      "<td>" + fmtSeen(x.last_seen_at) + "</td>" +
      "<td>" + (x.active ? "<button class='btn small' onclick='deactivate(" + x.id + ",\"" +
                x.worker_name.replace(/"/g, "&quot;") + "\")'>כיבוי</button>" : "") + "</td></tr>").join("");
    document.getElementById("listWrap").innerHTML = d.devices.length
      ? "<table><tr><th>מסופון</th><th>מצב</th><th>נראה לאחרונה</th><th></th></tr>" + rows + "</table>"
      : "<div class='muted'>אין עדיין מסופונים.</div>";
  } catch (e) { document.getElementById("listWrap").innerHTML = "<div class='err'>" + e.message + "</div>"; }
}

async function createDevice() {
  seterr("createErr", "");
  const name = document.getElementById("workerName").value.trim();
  if (!name) { seterr("createErr", "יש להזין שם מסופון"); return; }
  try {
    const d = await api("/field/api/devices", "POST", {worker_name: name});
    document.getElementById("tokenBox").textContent = d.token;
    show("tokenWrap", true);
    document.getElementById("copied").classList.add("hidden");
    document.getElementById("workerName").value = "";
    refreshList();
  } catch (e) { seterr("createErr", e.message); }
}

async function copyToken() {
  const t = document.getElementById("tokenBox").textContent;
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("tokenBox"));
              const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
  document.getElementById("copied").classList.remove("hidden");
}

async function deactivate(id, name) {
  if (!confirm("לכבות את המסופון \"" + name + "\"? הטאבלט שלו יפסיק לעבוד עד שיוזן מפתח חדש.")) return;
  try { await api("/field/api/devices/" + id, "DELETE"); refreshList(); }
  catch (e) { alert(e.message); }
}

if (TOK) { enter(); } else { show("loginCard", true); }
</script>
</body>
</html>
